<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1024 1024%22%3E%3Crect width=%221024%22 height=%221024%22 rx=%22224%22 fill=%22#111318%22/%3E%3Crect x=%22150%22 y=%22170%22 width=%22460%22 height=%22390%22 rx=%22110%22 fill=%22#fff%22/%3E%3Cpath d=%22M191 550H311L211 655z%22 fill=%22#fff%22/%3E%3Crect x=%22380%22 y=%22380%22 width=%22528%22 height=%22458%22 rx=%22144%22 fill=%22#111318%22/%3E%3Cpath d=%22M679 794H867L833 947z%22 fill=%22#111318%22/%3E%3Crect x=%22414%22 y=%22414%22 width=%22460%22 height=%22390%22 rx=%22110%22 fill=%22#1f6bff%22/%3E%3Cpath d=%22M713 794H833L813 899z%22 fill=%22#1f6bff%22/%3E%3Ctext x=%22325%22 y=%22470%22 font-family=%22Segoe UI,Arial,sans-serif%22 font-weight=%22700%22 font-size=%22300%22 text-anchor=%22middle%22 fill=%22#111318%22%3EA%3C/text%3E%3Ctext x=%22644%22 y=%22700%22 font-family=%22Malgun Gothic,Pretendard,sans-serif%22 font-weight=%22700%22 font-size=%22270%22 text-anchor=%22middle%22 fill=%22#fff%22%3E%EA%B0%80%3C/text%3E%3C/svg%3E">
<title>동영상 동시 통역기</title>
<style>
/* 작은 세로 창. 회색 바탕 위 흰 카드, 파란 강조 (배지 대시보드와 같은 결) */
:root {
  --bg: #e9ebef; --panel: #ffffff; --panel-2: #f3f4f7; --ink: #111318; --ink-2: #5d6370;
  --line: #e2e4ea; --blue: #1f6bff; --blue-soft: #dbe6ff; --night: #0f1014; --ok: #16a05a; --warn: #c77700;
  --font: "Pretendard", "Pretendard Medium", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 500 14px/1.5 var(--font); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
body > * { flex-shrink: 0; }  /* 내용이 창보다 길면 버튼·카드가 납작해지던 것 (11/08) → 줄이지 말고 스크롤 */
.card { background: var(--panel); border-radius: 20px; padding: 16px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.label { font-size: 11px; letter-spacing: 0.06em; color: var(--ink-2); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px; border-radius: 999px; background: var(--panel-2); font-size: 12px; font-weight: 600; color: var(--ink-2); max-width: 100%; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-2); flex: none; }
.pill.on i { background: var(--ok); } .pill.warn i { background: var(--warn); }
.pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 머리 줄: 마크·이름·버전·설정만. 이름은 절대 접히지 않는다 (11/08: 긴 상태 문구에 밀려 세로로 접혔음) */
.head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.head h1 { white-space: nowrap; min-width: 0; }
/* 새 버전 띠 (11/08): 회사·집 PC 형상을 맞추게. 눈에는 띄지만 주 버튼보다 가볍게 */
.update { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; border-radius: 16px; background: var(--blue-soft); animation: drop .25s ease-out; }
.update[hidden] { display: none; }
.update > .ic svg { color: var(--blue); width: 20px; height: 20px; }
.update .u-text { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.35; }
.update b { font-size: 13.5px; }
.update .u-text span { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.update .btn { flex: none; background: var(--panel); border-color: transparent; color: var(--blue); font-weight: 700; height: 34px; }  /* 주 행동(읽기 시작)과 안 겨루게 흰 버튼 */
.update .btn:hover:not(:disabled) { background: #f5f8ff; }
.update .btn:disabled { opacity: .6; cursor: default; }
@keyframes drop { from { opacity: 0; transform: translateY(-4px); } }
@media (prefers-reduced-motion: reduce) { .update { animation: none; } }
/* 읽기 카드: 상태 줄 + 큰 버튼. 상태는 '읽기'의 상태라 버튼 바로 위에 둔다 */
.control { display: flex; flex-direction: column; gap: 12px; }
.state { display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 20px; font-size: 13px; }
.state .dot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: #b6bac4; flex: none; }
.state.on .dot { background: var(--ok); }
.state.on .dot::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--ok); opacity: 0; animation: ring 1.8s ease-out infinite; }
@keyframes ring { 0% { transform: scale(.5); opacity: .55; } 100% { transform: scale(1.4); opacity: 0; } }
.state.warn .dot { background: var(--warn); }
/* 11/11 준비 중 진행 막대: 모델 올리기·엔진 다시 켜기는 진행률을 안 알려 줘서, 지난번 걸린 시간을 100% 로 잡고 채운다 */
.load { display: flex; flex-direction: column; gap: 7px; padding: 12px 14px; border-radius: 14px; background: var(--blue-soft); animation: loadIn .3s cubic-bezier(.2,.8,.2,1); }
.load[hidden] { display: none; }
.load.done { animation: loadOut .45s ease .25s forwards; }
@keyframes loadIn { from { opacity: 0; transform: translateY(-4px); } }
@keyframes loadOut { to { opacity: 0; transform: translateY(-4px); } }
.load-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.load-label { font-size: 13px; font-weight: 700; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.load-pct { font-size: 20px; font-weight: 800; color: var(--blue); font-variant-numeric: tabular-nums; letter-spacing: -.02em; flex: none; }
.load-bar { position: relative; height: 8px; border-radius: 99px; background: rgba(31,107,255,.16); overflow: hidden; }
.load-bar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: linear-gradient(90deg, #1f6bff, #5b93ff); transition: width .25s linear; }
.load-bar i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform: translateX(-100%); animation: shimmer 1.4s ease-in-out infinite; }
@keyframes shimmer { to { transform: translateX(100%); } }
.load-sub { font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .load, .load.done { animation: none; } .load-bar i { transition: none; } .load-bar i::after { animation: none; } }
.state b { flex: 0 1 auto; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }  /* 긴 안내가 카드 밖으로 삐져나가던 것 (11/10) */
.state span { color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.state.warn { align-items: flex-start; }
.state.warn .dot { margin-top: 6px; }
.state.warn b { white-space: normal; word-break: keep-all; overflow-wrap: anywhere; }
.state.warn span { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }  /* 문제 안내는 자르지 않고 두 줄까지 */
.go { width: 100%; height: 52px; border: 0; border-radius: 16px; font: 700 16px var(--font); cursor: pointer; background: var(--blue); color: #fff;
      transition: background-color .15s, color .15s, transform .1s; }
.go:hover { background: #185be0; }
.go:active { transform: scale(.985); }
.go.stop { background: var(--panel-2); color: var(--ink); }           /* 읽는 중: 살아 있다는 신호는 초록 점이 맡고 버튼은 차분하게 */
.go.stop:hover { background: #e6e8ed; }
/* 화면 번역: 읽기와 따로 노는 보조 기능 → 흰 바탕, 단축키는 키캡으로 */
.screen-btn { width: 100%; height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 14px; border-radius: 14px;
              border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 600 14px var(--font); cursor: pointer;
              transition: background-color .15s, transform .1s; }
.screen-btn:hover { background: var(--panel-2); }
.screen-btn:active { transform: scale(.985); }
.screen-btn svg { width: 19px; height: 19px; flex: none; }
.keys { margin-left: auto; display: inline-flex; gap: 3px; }
kbd { font: 600 11px var(--font); color: var(--ink-2); background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px;
      border-radius: 6px; padding: 1px 6px; line-height: 16px; }
@media (prefers-reduced-motion: reduce) { .state.on .dot::after { animation: none; } .go, .screen-btn { transition: none; } .go:active, .screen-btn:active { transform: none; } }
.now { background: var(--night); color: #fff; border-radius: 20px; padding: 16px; min-height: 120px; display: flex; flex-direction: column; gap: 8px; }
.now .label { color: #a6abb8; }
.now .ko { font-size: 19px; font-weight: 700; line-height: 1.45; }
.now .en { font-size: 12.5px; color: #a6abb8; }
.speaking-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); display: inline-block; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .speaking-dot { animation: none; } }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--panel-2); border-radius: 14px; padding: 8px 10px; }
.stat b { display: block; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--ink-2); }
.set { display: flex; flex-direction: column; gap: 12px; }
.field { display: grid; grid-template-columns: 82px 1fr 44px; align-items: center; gap: 10px; }
.field label { font-size: 13px; font-weight: 600; }
.field output { font-size: 12px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--blue); }
select { width: 100%; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font: 500 13px var(--font); padding: 0 8px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 600; }
.switch input { width: 40px; height: 22px; accent-color: var(--blue); }
.btn { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font: 600 13px var(--font); cursor: pointer; color: var(--ink); }
.recent { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 210px; overflow: auto; }
.recent li { border-top: 1px solid var(--line); padding-top: 8px; }
.recent li:first-child { border-top: 0; padding-top: 0; }
.recent .ko { font-size: 13.5px; }
.recent .meta { font-size: 11px; color: var(--ink-2); display: flex; gap: 8px; }
.hint { font-size: 12px; color: var(--ink-2); }
.brand { gap: 8px; } .brand svg { flex: none; border-radius: 6px; }  /* 앱 아이콘 (11/08: 말풍선 A→가) */
.maker { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 2px 0 4px; font-size: 12px; color: var(--ink-2); }
.maker svg { color: var(--ink); flex: none; }  /* 희랑 메이커 마크: 앱 아이콘이 아니라 '만든 사람' 자리. 흰색·검은색만 */
.setup { display: flex; flex-direction: column; gap: 10px; }
.setup[hidden] { display: none; }
.check { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; }
.check .t { font-weight: 700; font-size: 13.5px; }
.check .d { font-size: 12px; color: var(--ink-2); }
.check .ok { color: var(--ok); } .check .no { color: #d93025; } .check .wa { color: var(--warn); }
.check .sk { color: var(--ink-2); opacity: .5; }  /* 이 PC 에선 안 쓰는 것 (11/11) */
.check.skip .t, .check.skip .d { color: var(--ink-2); }
/* 11/11 준비 점검 카드 열릴 때 모션: 카드가 살짝 내려오고, 줄이 위에서부터 차례로 */
.setup.enter { animation: setupIn .42s cubic-bezier(.2, .8, .2, 1) both; transform-origin: top center; }
.setup.enter .check { animation: rowIn .45s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 60ms + 90ms); }
@keyframes setupIn { from { opacity: 0; transform: translateY(-10px) scale(.985); } }
@keyframes rowIn { from { opacity: 0; transform: translateY(8px); } }
.check .pop { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both; }  /* 빨강·노랑 → 초록으로 바뀌는 순간 */
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: none; opacity: 1; } }
#setupRe.spin svg { animation: spin .6s ease-in-out; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .setup.enter, .setup.enter .check, .check .pop, #setupRe.spin svg { animation: none; } }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.btn.primary svg { width: 16px; height: 16px; }
.bar { height: 6px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); width: 0; transition: width .4s; }
.head-btns { display: flex; align-items: center; gap: 8px; }
.ic { display: inline-flex; align-items: center; gap: 6px; }
.ic svg { flex: none; }
.go { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.go svg { width: 22px; height: 22px; }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; padding: 0; }
.icon-btn:hover { background: var(--panel-2); }
.icon-btn[aria-pressed="true"] { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); }
.sub-row { display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 10px; }
.sub-row > .ic { font-size: 13px; font-weight: 600; white-space: nowrap; }  /* '배경 불투명도'가 '도'만 다음 줄로 떨어지던 것 (11/08) */
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper output { min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { outline: 2px solid var(--blue); outline-offset: 2px; }
.sw-custom { position: relative; width: 26px; height: 26px; border-radius: 50%; overflow: hidden; border: 2px dashed var(--ink-2); display: inline-grid; place-items: center; color: var(--ink-2); cursor: pointer; }
.sw-custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.sw-custom svg { width: 14px; height: 14px; }
.preview-wrap { border-radius: 14px; padding: 10px; background: repeating-conic-gradient(#d5d8de 0 25%, #eef0f3 0 50%) 0 0 / 16px 16px; }
.preview { border-radius: 10px; padding: 10px 12px; text-align: center; }
.preview .pk { font-weight: 700; line-height: 1.35; }
.preview .pe { font-size: 11px; opacity: .7; margin-top: 2px; }
.sub-head { display: flex; align-items: center; justify-content: space-between; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
</style>
</head>
<body>
  <header class="head">
    <h1 class="ic brand"><svg viewBox="0 0 1024 1024" width="24" height="24" aria-hidden="true"><rect width="1024" height="1024" rx="224" fill="#111318"/><rect x="150" y="170" width="460" height="390" rx="110" fill="#fff"/><path d="M191 550H311L211 655z" fill="#fff"/><rect x="380" y="380" width="528" height="458" rx="144" fill="#111318"/><path d="M679 794H867L833 947z" fill="#111318"/><rect x="414" y="414" width="460" height="390" rx="110" fill="#1f6bff"/><path d="M713 794H833L813 899z" fill="#1f6bff"/><text x="325" y="470" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="300" text-anchor="middle" fill="#111318">A</text><text x="644" y="700" font-family="Malgun Gothic,Pretendard,sans-serif" font-weight="700" font-size="270" text-anchor="middle" fill="#fff">가</text></svg><span>동영상 동시 통역기</span><span id="ver" style="font-size:11px;font-weight:600;color:var(--ink-2);margin-left:2px"></span></h1>
    <button class="icon-btn" id="setupBtn" type="button" title="준비 점검" aria-label="준비 점검" data-icon="Settings02"></button>
  </header>

  <div class="update" id="update" hidden role="status">
    <span class="ic" data-icon="Download04"></span>
    <div class="u-text"><b id="upTitle">새 버전 나왔어</b><span id="upDetail"></span></div>
    <button class="btn" id="upBtn" type="button">업데이트</button>
  </div>

  <section class="card setup" id="setup" hidden aria-labelledby="setupTitle">
    <div class="row between"><span class="ic" id="setupTitle" style="font-weight:700">준비 점검</span>
      <button class="icon-btn" id="setupRe" type="button" title="다시 점검" aria-label="다시 점검" data-icon="Refresh"></button></div>
    <div id="checks"></div>
    <div id="job" hidden><div class="bar"><i id="jobBar"></i></div><div class="hint" id="jobText" style="margin-top:4px"></div></div>
    <div class="hint" id="setupHint"></div>
  </section>

  <section class="card control" aria-label="영상 소리 번역">
    <div class="state" id="status" role="status"><i class="dot"></i><b id="stMain">대기 중</b><span id="stDetail"></span></div>
    <div class="load" id="load" hidden aria-live="polite">
      <div class="load-top"><span class="load-label" id="loadLabel">준비 중</span><span class="load-pct" id="loadPct">0%</span></div>
      <div class="load-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="loadBar"><i id="loadFill"></i></div>
      <div class="load-sub" id="loadSub"></div>
    </div>
    <button class="go" id="go" type="button">읽기 시작</button>
  </section>

  <button class="screen-btn" id="screenBtn" type="button" data-icon="LanguageSkill" title="맨 앞 창의 영어를 한국어로 덮기">화면 번역
    <span class="keys" aria-label="단축키 Ctrl Shift T"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>T</kbd></span></button>

  <section class="now" aria-live="polite">
    <div class="row between"><span class="label">지금 읽는 문장</span><span id="spk"></span></div>
    <div class="ko" id="nowKo">영상을 켜고 '읽기 시작'을 눌러.</div>
    <div class="en" id="nowEn"></div>
  </section>

  <section class="stats">
    <div class="stat"><b id="sSpoken">0</b><span>읽음</span></div>
    <div class="stat"><b id="sDelay">0</b><span>평균 지연(초)</span></div>
    <div class="stat"><b id="sDups">0</b><span>중복 버림</span></div>
    <div class="stat"><b id="sFrags">0</b><span>토막 버림</span></div>
  </section>

  <section class="card set">
    <div class="field">
      <label for="rate" class="ic" data-icon="DashboardSpeed01">빠르기</label>
      <input type="range" id="rate" min="150" max="300" step="5">
      <output id="rateOut"></output>
    </div>
    <div class="field">
      <label for="volume" class="ic" data-icon="VolumeHigh">음량</label>
      <input type="range" id="volume" min="0" max="100" step="5">
      <output id="volOut"></output>
    </div>
    <div class="field">
      <label for="source" class="ic" data-icon="Translate">번역</label>
      <select id="source">
        <option value="local">내 PC (EXAONE 7.8B) · 번역기 앱 필요 없음</option>
        <option value="translator">번역기 앱 (구글)</option>
      </select>
      <span></span>
    </div>
    <div class="field">
      <label for="ear" class="ic" data-icon="Mic01">귀</label>
      <select id="ear">
        <option value="auto">자동</option>
        <option value="whisper">Whisper · PC 소리 직접 받아쓰기</option>
        <option value="captions">윈도우 실시간 자막 (윈11)</option>
      </select>
      <span></span>

const $ = id => document.getElementById(id);
document.querySelectorAll("[data-icon]").forEach(el => el.insertAdjacentHTML("afterbegin", HI[el.dataset.icon] || ""));
const COLORS = [["#0f1014","검정"],["#1b2a4a","남색"],["#1f6bff","파랑"],["#3a3d45","진회색"],["#ffffff","흰색"],["#ffe14d","노랑"]];
COLORS.forEach(([c, name]) => {
  const b = document.createElement("button"); b.type = "button"; b.className = "sw"; b.style.background = c;
  b.dataset.color = c; b.title = name; b.setAttribute("aria-label", "배경 " + name);
  b.addEventListener("click", () => setOverlay({ overlay_bg: c }));
  $("swatches").insertBefore(b, $("swatches").lastElementChild);
});
function inkFor(hex) {  // 배경이 밝으면 검은 글자
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#111318" : "#ffffff";
}
let ov = null, alphaEditing = false, alphaTimer = null;
function renderOverlay(st) {
  ov = st;
  $("ovOn").innerHTML = HI[st.overlay_on ? "View" : "ViewOff"]; $("ovOn").setAttribute("aria-pressed", st.overlay_on);
  $("ovEn").innerHTML = HI[st.overlay_en ? "View" : "ViewOff"]; $("ovEn").setAttribute("aria-pressed", st.overlay_en);
  $("szOut").textContent = st.overlay_size;
  if (!alphaEditing) { $("alpha").value = st.overlay_alpha; $("alphaOut").textContent = st.overlay_alpha + "%"; }
  document.querySelectorAll(".sw").forEach(b => b.setAttribute("aria-pressed", b.dataset.color === st.overlay_bg));
  if (document.activeElement !== $("bgCustom")) $("bgCustom").value = st.overlay_bg;
  const pv = $("pv"); pv.style.color = inkFor(st.overlay_bg);
  paintPreview(st.overlay_bg, alphaEditing ? +$("alpha").value : st.overlay_alpha);
  if (!radiusEditing) { $("radius").value = st.overlay_radius; $("radiusOut").textContent = st.overlay_radius + "px"; }
  pv.style.borderRadius = Math.round((radiusEditing ? +$("radius").value : st.overlay_radius) * 0.6) + "px";
  pv.style.textShadow = inkFor(st.overlay_bg) === "#ffffff" ? "0 0 2px #000, 0 0 2px #000" : "0 0 2px #fff, 0 0 2px #fff";
  $("pvKo").style.fontSize = Math.round(st.overlay_size * 0.75) + "px";
  $("pvEn").hidden = !st.overlay_en;
}
function paintPreview(hex, alpha) {  // 배경만 투명하게: 색 + 알파
  $("pv").style.background = hex + Math.round(alpha / 100 * 255).toString(16).padStart(2, "0");
}
let radiusEditing = false, radiusTimer = null;
$("radius").addEventListener("input", () => {
  radiusEditing = true; $("radiusOut").textContent = $("radius").value + "px";
  $("pv").style.borderRadius = Math.round($("radius").value * 0.6) + "px";
  clearTimeout(radiusTimer);
  radiusTimer = setTimeout(async () => { await setOverlay({ overlay_radius: +$("radius").value }); radiusEditing = false; }, 150);
});
async function setOverlay(patch) { render(await api("/api/settings", patch)); }
$("ovOn").addEventListener("click", () => setOverlay({ overlay_on: !ov.overlay_on }));
$("ovEn").addEventListener("click", () => setOverlay({ overlay_en: !ov.overlay_en }));
$("szDown").addEventListener("click", () => setOverlay({ overlay_size: Math.max(14, ov.overlay_size - 2) }));
$("szUp").addEventListener("click", () => setOverlay({ overlay_size: Math.min(44, ov.overlay_size + 2) }));
$("bgCustom").addEventListener("input", e => setOverlay({ overlay_bg: e.target.value }));
$("alpha").addEventListener("input", () => {
  alphaEditing = true; $("alphaOut").textContent = $("alpha").value + "%";
  paintPreview(ov.overlay_bg, +$("alpha").value);
  clearTimeout(alphaTimer);
  alphaTimer = setTimeout(async () => { await setOverlay({ overlay_alpha: +$("alpha").value }); alphaEditing = false; }, 150);
});
let state = null, editing = false, timer = null, updating = false;

async function api(path, body) {
  const r = await fetch(path, { method: body === undefined ? "GET" : "POST",
    headers: { "Content-Type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  return r.json();
}

// ---- 준비 중 진행 막대 (11/11) ----
// 서버는 '지난 시간·예상 시간'만 준다. 0.6초 사이는 화면에서 시계로 이어서 부드럽게 채운다.
let loadInfo = null, loadAt = 0, loadRaf = 0, loadShown = false;
function loadPct(elapsed, expect) {
  const r = elapsed / Math.max(1, expect);
  if (r < 1) return r * 92;                              // 예상 시간까지 92%
  return Math.min(99, 92 + 7 * (1 - Math.exp(-(r - 1) * 1.5)));  // 넘으면 천천히 99% 쪽으로 (멈춘 것처럼 안 보이게)
}
function drawLoad() {
  if (!loadInfo) return;
  const el = loadInfo.elapsed + (performance.now() - loadAt) / 1000;
  const p = loadPct(el, loadInfo.expect);
  $("loadFill").style.width = p.toFixed(1) + "%";
  $("loadPct").textContent = Math.floor(p) + "%";
  $("loadBar").setAttribute("aria-valuenow", Math.floor(p));
  const left = Math.max(0, Math.ceil(loadInfo.expect - el));
  $("loadSub").textContent = left > 0 ? `보통 ${Math.round(loadInfo.expect)}초쯤 걸려 · 약 ${left}초 남음` : `조금만 더… (${Math.round(el)}초 지남)`;
  loadRaf = requestAnimationFrame(drawLoad);
}
function renderLoad(ld) {
  const box = $("load");
  if (ld) {
    const fresh = !loadInfo || loadInfo.label !== ld.label;
    loadInfo = ld; loadAt = performance.now();
    $("loadLabel").textContent = ld.label;
    if (!loadShown) { box.hidden = false; box.classList.remove("done"); loadShown = true; }
    if (fresh) { cancelAnimationFrame(loadRaf); drawLoad(); }
  } else if (loadShown) {
    loadShown = false; loadInfo = null; cancelAnimationFrame(loadRaf);
    $("loadFill").style.width = "100%"; $("loadPct").textContent = "100%"; $("loadSub").textContent = "준비 끝";
    box.classList.add("done");
    setTimeout(() => { if (!loadShown) { box.hidden = true; box.classList.remove("done"); $("loadFill").style.width = "0"; } }, 750);
  }
}

function render(s) {
  state = s;
  renderLoad(s.running ? s.loading : null);
  // 상태 줄: "듣는 중 · Whisper(GPU) · 헤드폰(…)" → 굵게 '듣는 중' + 회색 나머지 (길면 … , 문제 안내는 두 줄까지)
  const st = $("status");
  const raw = s.running ? s.status : "대기 중";
  const parts = raw.split(" · ");
  let main = parts[0], detail = parts.slice(1).join(" · ").replace(" [Loopback]", "");
  if (!s.running) detail = "귀 · " + (s.ear === "whisper" ? "Whisper (PC 소리 직접 받아쓰기)" : "윈도우 실시간 자막");
  st.className = "state" + (s.running ? (main === "듣는 중" ? " on" : " warn") : "");
  if (updating) {  // 업데이트 창이 이 앱을 끄기 전까지 앱은 살아 있어서, 상태 갱신이 '대기 중'으로 덮어쓰지 않게
    st.className = "state warn"; main = "업데이트 중"; detail = "검은 창에서 받고 만드는 중 (1분쯤). 끝나면 새 창이 떠";
  }
  if (s.running && s.loading) { main = "준비 중"; detail = ""; }  // 자세한 건 아래 진행 막대가 말한다
  $("stMain").textContent = main; $("stDetail").textContent = detail; st.title = raw;
  // 새 버전 띠
  const u = s.update || {};
  $("update").hidden = !u.available || updating;
  if (u.available && !updating) {
    $("upTitle").textContent = u.latest_version && u.latest_version !== s.version ? `새 버전 v${u.latest_version} 나왔어` : "고친 판이 나왔어";
    $("upDetail").textContent = `바뀐 것 ${u.behind}개 · ${u.latest}`;
    $("upDetail").title = u.latest;
    $("upBtn").textContent = s.running ? "멈추고 업데이트" : "업데이트";
  }
  if ($("go").dataset.running !== String(s.running)) {  // 바뀔 때만 다시 그린다 (0.6초마다 깜빡이지 않게)
    $("go").dataset.running = String(s.running);
    $("go").innerHTML = HI[s.running ? "Stop" : "Play"] + `<span>${s.running ? "멈추기" : "읽기 시작"}</span>`;
  }
  renderOverlay(s.settings);
  if (s.version) $("ver").textContent = "v" + s.version;
  $("go").className = "go" + (s.running ? " stop" : "");
  if (s.speaking) {
    $("nowKo").textContent = s.speaking;
    $("spk").innerHTML = '<span class="speaking-dot" title="말하는 중"></span>';
  } else {
    $("spk").textContent = "";
    if (s.running && s.current.ko) $("nowKo").textContent = s.current.ko;
    if (!s.running) $("nowKo").textContent = "영상을 켜고 '읽기 시작'을 눌러.";  // 11/11: 멈추면 마지막 문장을 지운다
  }
  $("nowEn").textContent = s.running ? (s.current.en || "") : "";
  $("sSpoken").textContent = s.stats.spoken;
  $("sDelay").textContent = s.stats.avg_delay;
  $("sDups").textContent = s.stats.dups;
  $("sFrags").textContent = s.stats.frags;
  if (!editing) {
    $("rate").value = s.settings.base_rate; $("rateOut").textContent = s.settings.base_rate;
    $("volume").value = s.settings.volume; $("volOut").textContent = s.settings.volume;
    $("auto").checked = s.settings.auto_speed; $("frag").checked = s.settings.filter_fragments;
    const sel = $("voice");
    if (sel.options.length !== s.voices.length) {
      sel.innerHTML = "";
      s.voices.forEach(v => { const o = document.createElement("option"); o.value = v.id; o.textContent = v.label; sel.appendChild(o); });
    }
    if (s.voices.some(v => v.id === s.settings.voice)) sel.value = s.settings.voice;
    $("source").value = s.settings.source;
    const lm = (s.settings.local_model || "").replace(/^exaone3\.5:/i, "EXAONE ").toUpperCase();  // 11/11: 작은 모델(2.4B)로 바뀐 PC 도 맞게
    $("source").options[0].textContent = `내 PC (${lm}) · 번역기 앱 필요 없음`;
    $("source").disabled = s.running;  // 읽는 중엔 못 바꿈 (멈추고 바꾸기)
    // 귀: 자동이면 지금 무엇을 쓰는지 보여 주고, 실시간 자막이 없는 PC(윈10)에선 그 선택지를 막는다
    const ear = $("ear");
    ear.options[0].textContent = "자동 · 지금 " + (s.ear === "whisper" ? "Whisper" : "실시간 자막");
    ear.options[2].disabled = !s.captions_available;
    ear.options[2].textContent = "윈도우 실시간 자막" + (s.captions_available ? "" : " · 이 PC엔 없음 (윈11 전용)");
    ear.value = s.settings.ear || "auto";
    ear.disabled = s.running;
    // Whisper 귀는 실시간 자막을 안 쓰니 '번역기 앱(구글)'은 못 쓴다 → 내 PC 번역으로 돈다
    $("source").options[1].disabled = s.ear === "whisper";
  }
  const ul = $("recent");
  if (!s.recent.length) { ul.innerHTML = '<li class="hint">아직 없어</li>'; return; }
  ul.innerHTML = "";
  s.recent.forEach(r => {
    const li = document.createElement("li");
    const ko = document.createElement("div"); ko.className = "ko"; ko.textContent = r.ko;
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = `${r.time} · 지연 ${r.delay}초 · 빠르기 ${r.rate}`;
    li.append(ko, meta); ul.appendChild(li);
  });
}

async function poll() {
  try { render(await api("/api/state")); } catch (e) {
    $("status").className = "state warn";
    if (updating) { $("stMain").textContent = "업데이트 중"; $("stDetail").textContent = "끝나면 새 창이 떠. 이 창은 닫혀도 괜찮아"; }
    else { $("stMain").textContent = "앱 연결 끊김"; $("stDetail").textContent = "동영상 동시 통역기를 다시 켜 줘"; }
  }
}
setInterval(poll, 600); poll();

// ---- 준비 점검 ----
let setupOpen = false, setupTimer = null, lastOk = {};
function showSetup(open) {  // 열 때만 모션 (4초마다 다시 그릴 땐 안 움직이게)
  setupOpen = open; const el = $("setup");
  if (open && el.hidden) { el.hidden = false; el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter");
    setTimeout(() => el.classList.remove("enter"), 1000); }
  if (!open) el.hidden = true;
}
const ACT = { install: ["Ollama 설치", "/api/setup/install"], start: ["Ollama 켜기", "/api/setup/start"], pull: ["모델 받기", "/api/setup/pull"],
              cuda: ["GPU 부품 받기", "/api/setup/cuda"] };
function renderSetup(c) {
  const box = $("checks"); box.innerHTML = "";
  c.items.forEach((it, i) => {
    const row = document.createElement("div"); row.className = "check" + (it.skip ? " skip" : ""); row.style.setProperty("--i", i);
    const mark = it.skip ? ["CheckmarkCircle02", "sk"] : it.ok ? ["CheckmarkCircle02", "ok"] : it.warn ? ["Alert02", "wa"] : ["CancelCircle", "no"];
    const pop = it.ok && !it.skip && lastOk[it.key] === false ? " pop" : "";
    lastOk[it.key] = !!it.ok;
    row.innerHTML = `<span class="${mark[1]}${pop}">${HI[mark[0]]}</span><div><div class="t"></div><div class="d"></div></div><span></span>`;
    row.querySelector(".t").textContent = it.label; row.querySelector(".d").textContent = it.detail;
    if (it.action && c.job.status !== "running") {
      const b = document.createElement("button"); b.className = "btn primary"; b.type = "button";
      b.innerHTML = HI[it.action === "pull" ? "Download04" : "Download04"] + ACT[it.action][0];
      b.addEventListener("click", async () => renderSetup(await api(ACT[it.action][1], {})));
      row.lastElementChild.appendChild(b);
    }
    box.appendChild(row);
  });
  const j = c.job, running = j.status === "running";
  $("job").hidden = !(running || j.status === "error");
  $("jobBar").style.width = (j.percent || 0) + "%";
  $("jobText").textContent = running ? `${{install: "Ollama 설치 중", start: "Ollama 켜는 중", pull: "모델 받는 중", cuda: "GPU 부품 받는 중"}[j.kind] || ""} · ${j.percent || 0}%`
    : (j.status === "error" ? "안 됐어요: " + j.error : "");
  $("setupHint").textContent = c.ready ? "준비 끝. 영상을 틀고 '읽기 시작'을 누르세요." : "빨간 줄을 위에서부터 채워 주세요.";
  if (!c.ready || running) showSetup(true);
  clearTimeout(setupTimer);
  if (running || (setupOpen && !c.ready)) setupTimer = setTimeout(checkSetup, running ? 1000 : 4000);
}
async function checkSetup() { try { renderSetup(await api("/api/setup")); } catch (e) {} }
$("setupBtn").addEventListener("click", () => { showSetup(!setupOpen); if (setupOpen) checkSetup(); });
$("setupRe").addEventListener("click", () => { const b = $("setupRe"); b.classList.remove("spin"); void b.offsetWidth; b.classList.add("spin"); checkSetup(); });
checkSetup();  // 처음 켤 때 한 번: 모자란 게 있으면 카드가 열린다

function sendSettings() {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    render(await api("/api/settings", {
      base_rate: +$("rate").value, volume: +$("volume").value,
      auto_speed: $("auto").checked, filter_fragments: $("frag").checked, voice: $("voice").value || "sapi:Heami", source: $("source").value, ear: $("ear").value }));
    editing = false;
  }, 250);
}
["rate", "volume"].forEach(id => $(id).addEventListener("input", () => {
  editing = true;
  $(id === "rate" ? "rateOut" : "volOut").textContent = $(id).value;
  sendSettings();
}));
["auto", "frag", "voice", "source", "ear"].forEach(id => $(id).addEventListener("change", () => { editing = true; sendSettings(); }));
$("go").addEventListener("click", async () => render(await api(state && state.running ? "/api/stop" : "/api/start", {})));
$("test").addEventListener("click", () => api("/api/test-voice", {}));
$("screenBtn").addEventListener("click", () => api("/api/screen", {}));  // 바로 전에 보던 창을 번역
$("logs").addEventListener("click", () => api("/api/open-logs", {}));
$("upBtn").addEventListener("click", async () => {  // 업데이트.bat 창이 떠서 받고·빌드하고 이 앱을 새 판으로 다시 켠다
  $("upBtn").disabled = true; $("upBtn").textContent = "여는 중…";
  updating = true;
  try { await api("/api/update", {}); } catch (e) {}
  $("update").hidden = true;
  $("status").className = "state warn"; $("stMain").textContent = "업데이트 중"; $("stDetail").textContent = "검은 창에서 받고 만드는 중 (1분쯤). 끝나면 새 창이 떠";
});
</script>
</body>
